<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel com legenda · exemplo RISE</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1c1714;overflow:hidden;font-family:Inter,sans-serif}
body{display:flex;flex-direction:column}
canvas{display:block;flex:1;min-height:0;width:100%}
.bar{display:flex;gap:6px;padding:6px;background:#1c1714}
.bar button,.bar label{flex:1;font:600 13px Inter,sans-serif;padding:8px 4px;border-radius:8px;border:1px solid #6b5a4c;background:#2a221d;color:#f6ecdf;cursor:pointer;text-align:center}
.bar input{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><label>escolher vídeo<input type="file" accept="video/*" id="arq"></label><button id="baixar" type="button">baixar vídeo</button></div>
<script>
// Nível 3 do método RISE: reel 9:16. Metade de cima: calendário vira até o dia 7.
// Metade de baixo: o seu vídeo (botão "escolher vídeo"), com legenda de até 3 palavras; a palavra falada acende.
// Tudo desenhado por render(ctx, t, theme, w, h). Loop de 10 s. ?t=5 congela.
const DUR = 10;
const theme = { bg: '#f6ecdf', ink: '#2a1f18', accent: '#d9577a', soft: '#a8927f', font: 'Inter' };
// tempo de cada palavra (início, fim) em segundos — o que viria do arquivo de legenda
const FALA = [['Encomenda', .4, 1.1], ['de', 1.1, 1.3], ['festa?', 1.3, 2.0], ['Peça', 2.6, 3.1], ['com', 3.1, 3.4], ['sete', 3.4, 4.0], ['dias', 4.0, 4.6], ['de', 4.6, 4.8], ['antecedência.', 4.8, 6.0]];
const BLOCOS = [[0, 3], [3, 7], [7, 9]].map(([a, b]) => FALA.slice(a, b));
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
let video = null;

function render(ctx, t, th, w, h) {
  t = ((t % DUR) + DUR) % DUR;
  const meio = h * .5, s = w;
  // metade de cima: papel com luz
  const g = ctx.createLinearGradient(0, 0, 0, meio);
  g.addColorStop(0, '#fbf4ea'); g.addColorStop(1, '#efe2d0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, meio);
  for (let i = 0; i < 900; i++) { ctx.fillStyle = `rgba(90,60,30,${hash(i, 3) * .07})`; ctx.fillRect(hash(i, 1) * w, hash(i, 2) * meio, 1.3, 1.3); }
  // calendário: vira do dia 1 ao 7 (0.3–6 s), segura, volta ao 1 no fim
  const ida = ease(clamp((t - .3) / 5.2)), volta = ease(clamp((t - 9.2) / .8));
  const dia = Math.max(1, Math.round(1 + 6 * ida * (1 - volta)));
  const cw = s * .52, ch = s * .52, cx = (w - cw) / 2, cy = meio * .2;
  ctx.fillStyle = 'rgba(60,40,20,.15)'; ctx.fillRect(cx + s * .015, cy + s * .02, cw, ch);
  ctx.fillStyle = '#fffdf8'; ctx.fillRect(cx, cy, cw, ch);
  ctx.fillStyle = th.accent; ctx.fillRect(cx, cy, cw, ch * .22);
  ctx.fillStyle = '#fffdf8'; ctx.font = `800 ${s * .05}px ${th.font}`; ctx.textAlign = 'center';
  ctx.fillText('ENCOMENDA', w / 2, cy + ch * .15);
  ctx.fillStyle = th.ink; ctx.font = `500 ${s * .26}px Newsreader, serif`;
  ctx.fillText(String(dia), w / 2, cy + ch * .82);
  // anel no dia 7
  const anel = dia === 7 ? ease(clamp((t - 5.6) / .6)) * (1 - volta) : 0;
  if (anel > 0) { ctx.strokeStyle = th.accent; ctx.lineWidth = s * .012; ctx.beginPath(); ctx.arc(w / 2, cy + ch * .58, s * .19, -Math.PI / 2, -Math.PI / 2 + anel * Math.PI * 2); ctx.stroke(); }
  ctx.fillStyle = th.ink; ctx.font = `600 ${s * .055}px ${th.font}`;
  ctx.globalAlpha = anel; ctx.fillText('dias antes da festa', w / 2, meio * .93); ctx.globalAlpha = 1;
  // metade de baixo: o vídeo da pessoa, ou um lugar reservado
  if (video && video.readyState >= 2) {
    const vr = video.videoWidth / video.videoHeight, br = w / (h - meio);
    let sw = video.videoWidth, sh = video.videoHeight, sx = 0, sy = 0;
    if (vr > br) { sw = sh * br; sx = (video.videoWidth - sw) / 2; } else { sh = sw / br; sy = (video.videoHeight - sh) / 2; }
    ctx.drawImage(video, sx, sy, sw, sh, 0, meio, w, h - meio);
  } else {
    ctx.fillStyle = '#3a302a'; ctx.fillRect(0, meio, w, h - meio);
    ctx.fillStyle = '#56483e';
    ctx.beginPath(); ctx.arc(w / 2, meio + (h - meio) * .38, s * .13, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w / 2, h + s * .02, s * .32, (h - meio) * .42, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#c9b6a5'; ctx.font = `600 ${s * .04}px ${th.font}`; ctx.fillText('o seu vídeo aqui', w / 2, meio + (h - meio) * .12);
  }
  // legenda: até 3 palavras, a falada acende
  const bloco = [...BLOCOS].reverse().find(b => t >= b[0][1] - .15 && t < b[b.length - 1][2] + .8);
  if (bloco) {
    ctx.font = `800 ${s * .075}px ${th.font}`;
    const esp = s * .02, larg = bloco.reduce((a, p) => a + ctx.measureText(p[0]).width, 0) + esp * (bloco.length - 1);
    let x = (w - larg) / 2; const y = meio + (h - meio) * .78;
    ctx.textAlign = 'left';
    bloco.forEach(([p, a, b]) => {
      const ativa = t >= a && t < b + .05;
      const pw = ctx.measureText(p).width;
      if (ativa) { ctx.fillStyle = th.accent; ctx.fillRect(x - esp * .6, y - s * .07, pw + esp * 1.2, s * .092); }
      ctx.fillStyle = ativa ? '#fff' : '#fff8ee'; ctx.lineWidth = s * .012; ctx.strokeStyle = 'rgba(0,0,0,.55)';
      if (!ativa) ctx.strokeText(p, x, y);
      ctx.fillText(p, x, y); x += pw + esp;
    });
    ctx.textAlign = 'center';
  }
  // grão sobre tudo
  for (let i = 0; i < 700; i++) { ctx.fillStyle = `rgba(255,255,255,${hash(i, 9) * .05})`; ctx.fillRect(hash(i, 7) * w, hash(i, 8) * h, 1.2, 1.2); }
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const fixo = new URLSearchParams(location.search).get('t');
function tamanho() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; }
addEventListener('resize', tamanho); tamanho();
let t0 = performance.now();
function agora(now) { return fixo !== null ? parseFloat(fixo) : (now - t0) / 1000; }
function loop(now) { render(ctx, agora(now), theme, cv.width, cv.height); if (fixo === null && !matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(loop); }
document.fonts.ready.then(() => requestAnimationFrame(loop));

document.getElementById('arq').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  video = document.createElement('video'); video.src = URL.createObjectURL(f); video.muted = true; video.loop = true; video.playsInline = true; video.play();
  t0 = performance.now();
});
// baixar: grava 10 s do quadro (1080x1920) e salva o arquivo
document.getElementById('baixar').addEventListener('click', async e => {
  const bt = e.target; bt.disabled = true; bt.textContent = 'gravando 10 s…';
  const off = document.createElement('canvas'); off.width = 1080; off.height = 1920; const oc = off.getContext('2d');
  const tipo = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(off.captureStream(30), tipo ? { mimeType: tipo } : {});
  const partes = []; rec.ondataavailable = ev => partes.push(ev.data);
  rec.onstop = () => {
    const blob = new Blob(partes, { type: rec.mimeType }); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'reel.' + (rec.mimeType.includes('mp4') ? 'mp4' : 'webm'); a.click();
    bt.disabled = false; bt.textContent = 'baixar vídeo';
  };
  const ini = performance.now(); if (video) video.currentTime = 0;
  rec.start();
  (function passo(now) { const t = (now - ini) / 1000; render(oc, Math.min(t, DUR), theme, 1080, 1920); if (t < DUR) requestAnimationFrame(passo); else rec.stop(); })(ini);
});
</script>
</body>
</html>
