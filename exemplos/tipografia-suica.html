<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tipografia suíça · exemplo RISE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0f0f0e;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Estilo 03 (pôster suíço): a palavra sobe de uma máscara, uma onda de peso percorre as letras,
// o disco vermelho pula pela grade na batida. Loop de 5 s. Função pura render(ctx, t, theme, w, h).
const DUR = 5;
const theme = { bg: '#0f0f0e', ink: '#f1eee7', accent: '#ff3b1f', font: 'Inter' };
const PALAVRA = 'Motion';

function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const quintOut = u => 1 - Math.pow(1 - u, 5);
const inOut = u => u < .5 ? 16 * Math.pow(u, 5) : 1 - Math.pow(-2 * u + 2, 5) / 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

function render(ctx, t, th, w, h) {
  t = ((t % DUR) + DUR) % DUR;
  const m = Math.min(w, h) * .08, col = (w - 2 * m) / 12;
  const g = ctx.createRadialGradient(w * .2, h * .2, 0, w * .5, h * .5, Math.max(w, h));
  g.addColorStop(0, '#1b1b19'); g.addColorStop(1, th.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // grade (fios finos)
  ctx.strokeStyle = 'rgba(241,238,231,.07)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 12; i++) { const x = m + i * col; ctx.beginPath(); ctx.moveTo(x, m); ctx.lineTo(x, h - m); ctx.stroke(); }
  // disco: muda de posição a cada batida (5 posições, volta à primeira)
  const pos = [[9, .2], [10.5, .16], [8, .22], [10, .14], [9, .2]];
  const bt = t / DUR * 4, i0 = Math.floor(bt), u = inOut(clamp((bt - i0) / .5));
  const a = pos[i0], b = pos[Math.min(i0 + 1, 4)];
  const dx = m + (a[0] + (b[0] - a[0]) * u) * col, dy = h * (a[1] + (b[1] - a[1]) * u);
  ctx.fillStyle = th.accent; ctx.beginPath(); ctx.arc(dx, dy, Math.min(col * .9, h * .09), 0, 7); ctx.fill();
  // palavra: entra (0–1.3), onda de peso (1.3–3.9), sai para cima (3.9–5)
  const base = h * .72, larg = (w - 2 * m) * .85;
  let size = larg / (PALAVRA.length * .62);
  size = Math.min(size, h * .4);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, base + size * .05); ctx.clip();
  let x = m;
  for (let k = 0; k < PALAVRA.length; k++) {
    const ent = quintOut(clamp((t - k * .06) / 1.0));
    const sai = inOut(clamp((t - 3.9 - k * .06) / .9));
    const onda = Math.sin((t / DUR) * Math.PI * 4 - k * .7);
    const peso = Math.round(560 + 300 * onda * clamp((t - 1.1) / .3) * (1 - clamp((t - 3.7) / .3)));
    ctx.font = `${peso} ${size}px ${th.font}, sans-serif`;
    const y = base + size * (1 - ent) - size * 1.1 * sai;
    ctx.fillStyle = th.ink; ctx.fillText(PALAVRA[k], x, y);
    ctx.font = `560 ${size}px ${th.font}, sans-serif`;
    x += ctx.measureText(PALAVRA[k]).width * .98;
  }
  ctx.restore();
  // fio da linha de base (recolhe no fim e volta)
  const fio = 1 - inOut(clamp((t - 4.2) / .6)) + inOut(clamp(t / .6)) - 1;
  ctx.fillStyle = th.ink; ctx.fillRect(m, base + size * .12, (w - 2 * m) * clamp(fio), 2);
  ctx.font = `500 ${Math.max(12, size * .07)}px ${th.font}, sans-serif`;
  ctx.fillStyle = 'rgba(241,238,231,.7)';
  ctx.fillText('Estilo 03 · pôster suíço', m, m + size * .07);
  // grão
  for (let i = 0; i < 1500; i++) { ctx.fillStyle = `rgba(255,255,255,${hash(i, 9) * .05})`; ctx.fillRect(hash(i, 7) * w, hash(i, 8) * h, 1.3, 1.3); }
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const fixo = new URLSearchParams(location.search).get('t');
function tamanho() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; }
addEventListener('resize', tamanho); tamanho();
const t0 = performance.now();
function loop(now) {
  render(ctx, fixo !== null ? parseFloat(fixo) : (now - t0) / 1000, theme, cv.width, cv.height);
  if (fixo === null && !matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(loop);
}
document.fonts.ready.then(() => requestAnimationFrame(loop));
</script>
</body>
</html>
